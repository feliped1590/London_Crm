<!doctype html>
<html lang="pt-BR" translate="no">

    <meta charset="UTF-8" />

    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="pt-BR" />

    <meta name="description" content="CRM London — gestão comercial moderna e multiempresa" />
    <meta name="author" content="London" />

    <meta property="og:title" content="CRM London" />
    <meta property="og:description" content="CRM London — gestão comercial moderna e multiempresa" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/london-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-FOUC: aplica tema antes do React montar -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('crm-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = stored;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
